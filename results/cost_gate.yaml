gate:
  source: audit/MMC_COMPOSITION_SPEC.md section 4, pre-registered in session G3
  cost_model: E[draws] = M * N / min_theta p_sel, per nuisance value, MULTIPLIED
  threshold_draws: 100000000.0
  declared_M:
  - 1000
  - 10000
  declared_N:
  - 99
  - 999
  declared_budget_draws: 10000000.0
  declared_budget_source: 'audit/S0_REPORT.md section 7: ''Forward simulation only, <=10^7 solves, no
    neural components | CPU-only holds; local, overnight''. The gate''s own threshold is 1e8, an order
    of magnitude ABOVE this. Both are reported; the gate verdict is taken on the gate''s threshold because
    that is the pre-registered one.'
  which_p_sel: 'minimum over the K selection cells and over the declared nuisance box, using the independently
    re-measured value at any refined point. Section 4 point 1: ''the cost is governed by min over theta
    of p_sel(theta) across the searched set, not by its value at a plausible theta''.'
  headline_box_half_width: 0.2
scope_assumption_D14: 'docs/DECISIONS.md D-14 (DECIDED, operator, 2026-08-20): every claim this project
  makes about component separability and attribution is scoped to a distortion model that assigns AT MOST
  ONE one-parameter distortion family to each component. Inside that scope S_B separates under all eight
  declarable family assignments; outside it, the six-column union is INSEPARABLE at kappa = 628.9 with
  a progression-observation confound. The selection rule measured here is a K = 3 object and is meaningful
  only under that restriction.'
