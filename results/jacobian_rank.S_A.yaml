framing: 'This diagnostic is INFRASTRUCTURE for a composition paper (maximized Monte Carlo, Dufour 2006,
  composed with a selection event for component-level misspecification attribution). It is NOT a claimed
  method contribution: the rank-and-condition-number screen on a sensitivity matrix is Cintron-Arias,
  Banks, Capaldi & Lloyd (2009) and finite differencing under simulation noise is More & Wild (2012).
  See docs/DECISIONS.md D-6 and audit/R2_THREAT_CHECK.md. Its purpose here is to decide whether component
  attribution is well posed for THIS simulator under THIS closed list of summary sets -- the precondition,
  per Kahl et al. (2019), for the composition being worth building at all.'
summary_set: S_A
summary_coordinate_labels:
- peak_height
- peak_time
- final_size
- growth_rate
component_labels:
- transmission
- progression
- observation
simulator:
  module: src/simulators/sir3.py
  components_K: 3
  components:
  - transmission
  - progression
  - observation
  base_parameters:
    N: 100000.0
    I0: 10.0
    beta: 0.35
    gamma: 0.14
    R0_basic: 2.4999999999999996
    T_days: 120
    substeps_per_day: 24
    rho: 0.4
    delay_mean_days: 3.0
    delay_shape: 3.0
    delay_kernel_len_days: 21
    obs_sigma: 0.15
  integrator: 'fixed-step RK4 (not adaptive: adaptive step selection is itself a source of computational
    noise)'
  distortion_families:
    transmission: beta*S*I/N -> beta*S*I/N / (1 + eta_1*(I/N)/p_ref)   [saturating incidence; prevalence
      nonlinearity]
    progression: gamma -> gamma*exp(eta_2*(t/T - 0.5))   [mean-centred log-linear hazard drift; timing/trend]
    observation: rho -> rho*exp(eta_3)   [reporting-fraction multiplier; pure amplitude]
  distortion_identity_at_zero: delta_k(.;0) == base simulator exactly, tested in tests/test_sir3.py
  p_ref_peak_prevalence_fraction: 0.2335235106521953
  summary_definitions:
    growth_rate_window_days:
    - 5
    - 25
    n_bins_S_B: 10
    peak_statistics: peak height and peak time are computed by PARABOLIC INTERPOLATION about the discrete
      argmax. A discrete argmax is integer-valued and therefore a step function of eta, with no finite-difference
      derivative at any h. This is a substantive choice about the summary, not an implementation detail.
normalisation:
  why_this_matters: The rank of J is NOT scale-invariant. Rescaling a summary or reparametrising eta_k
    changes the singular values and can change the numerical rank. Every threshold below is a statement
    about these normalisations and about nothing else.
  summaries:
    rule: each summary coordinate divided by its prior-predictive standard deviation at eta = 0
    n_replicates_R_norm: 2000
    seed0: 21160820
    coordinate_labels:
    - peak_height
    - peak_time
    - final_size
    - growth_rate
    prior_predictive_sd:
    - 182.67676332644606
    - 2.091297770353305
    - 933.2578128117411
    - 0.006007470674698982
    prior_predictive_mean:
    - 1909.4968036607652
    - 42.80043535095383
    - 35708.90078961138
    - 0.2082503466000218
    degenerate_coordinates_dropped: []
  distortions:
    rule: each eta_k divided by a fixed relative perturbation scale, identical across k
    eta_scale: 0.1
    meaning: One normalised unit is a 10% relative deformation of the component. Because eta_scale is
      COMMON across k, scaling it multiplies J by a constant and therefore leaves the normalised spectrum,
      the numerical rank at a relative tolerance, and the condition number unchanged; only the column-norm
      (invisible-component) test depends on its absolute value.
    transmission_saturation_reference_prevalence_p_ref: 0.2335235106521953
  interpretation_of_J_entry: J[d, k] is the change in summary d, in prior-predictive standard deviations,
    produced by a full-scale (one normalised unit) relative distortion of component k.
estimator:
  scheme: central differences, J[:,k] = mean_r [s(+h e_k; seed_r) - s(-h e_k; seed_r)] / (2h) / sd
  common_random_numbers: true
  why_common_random_numbers: 'The +h and -h evaluations use the SAME replicate seeds. Without this the
    two evaluations draw independent observation noise, the difference quotient inherits noise of order
    obs_sigma/h, and at small h that term swamps the signal: the finite difference then measures the simulator''s
    randomness rather than its response. See the no_crn_control results file, where the leading singular
    value grows exactly as 1/h.'
  n_replicates_R: 128
  seed0: 20260820
  n_simulator_runs: 1536
  noise_model: lognormal
  why_not_a_count_noise_model: 'Under common random numbers a count-valued observation layer (Poisson,
    negative binomial) is a STEP function of eta: the difference quotient is either exactly 0 or O(1/h)
    and no derivative exists at any h. A continuous multiplicative layer multiplies the derivative instead
    of quantising it. The observation noise model therefore determines whether J is estimable at all,
    which is a modelling constraint and not an implementation detail.'
