    degenerate_coordinates_dropped: []
  distortions:
    rule: each eta_k divided by a fixed relative perturbation scale, identical across k
    eta_scale: 0.1
    meaning: One normalised unit is a 10% relative deformation of the component. Because eta_scale is
      COMMON across k, scaling it multiplies J by a constant and therefore leaves the normalised spectrum,
      the numerical rank at a relative tolerance, and the condition number unchanged; only the column-norm
      (invisible-component) test depends on its absolute value.
    transmission_saturation_reference_prevalence_p_ref: 0.2335235106521953
  interpretation_of_J_entry: J[d, k] is the change in summary d, in prior-predictive standard deviations,
    produced by a full-scale (one normalised unit) relative distortion of component k.
estimator:
  scheme: central differences, J[:,k] = mean_r [s(+h e_k; seed_r) - s(-h e_k; seed_r)] / (2h) / sd
  common_random_numbers: true
  why_common_random_numbers: 'The +h and -h evaluations use the SAME replicate seeds. Without this the
    two evaluations draw independent observation noise, the difference quotient inherits noise of order
    obs_sigma/h, and at small h that term swamps the signal: the finite difference then measures the simulator''s
    randomness rather than its response. See the no_crn_control results file, where the leading singular
    value grows exactly as 1/h.'
  n_replicates_R: 128
  seed0: 20260820
  n_simulator_runs: 1536
  noise_model: lognormal
  why_not_a_count_noise_model: 'Under common random numbers a count-valued observation layer (Poisson,
    negative binomial) is a STEP function of eta: the difference quotient is either exactly 0 or O(1/h)
    and no derivative exists at any h. A continuous multiplicative layer multiplies the derivative instead
    of quantising it. The observation noise model therefore determines whether J is estimable at all,
    which is a modelling constraint and not an implementation detail.'
