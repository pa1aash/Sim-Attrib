simulator:
  module: src/simulators/sir3.py
  components_K: 3
  components:
  - transmission
  - progression
  - observation
  base_parameters:
    N: 100000.0
    I0: 10.0
    beta: 0.35
    gamma: 0.14
    R0_basic: 2.4999999999999996
    T_days: 120
    substeps_per_day: 24
    rho: 0.4
    delay_mean_days: 3.0
    delay_shape: 3.0
    delay_kernel_len_days: 21
    obs_sigma: 0.15
  integrator: 'fixed-step RK4 (not adaptive: adaptive step selection is itself a source of computational
    noise)'
  distortion_families:
    transmission: beta*S*I/N -> beta*S*I/N / (1 + eta_1*(I/N)/p_ref)   [saturating incidence; prevalence
      nonlinearity]
    progression: gamma -> gamma*exp(eta_2*(t/T - 0.5))   [mean-centred log-linear hazard drift; timing/trend]
    observation: rho -> rho*exp(eta_3)   [reporting-fraction multiplier; pure amplitude]
  distortion_identity_at_zero: delta_k(.;0) == base simulator exactly, tested in tests/test_sir3.py
  p_ref_peak_prevalence_fraction: 0.2335235106521953
  summary_definitions:
    growth_rate_window_days:
    - 5
    - 25
    n_bins_S_B: 10
    peak_statistics: peak height and peak time are computed by PARABOLIC INTERPOLATION about the discrete
      argmax. A discrete argmax is integer-valued and therefore a step function of eta, with no finite-difference
      derivative at any h. This is a substantive choice about the summary, not an implementation detail.
normalisation:
  why_this_matters: The rank of J is NOT scale-invariant. Rescaling a summary or reparametrising eta_k
    changes the singular values and can change the numerical rank. Every threshold below is a statement
    about these normalisations and about nothing else.
  summaries:
    rule: each summary coordinate divided by its prior-predictive standard deviation at eta = 0
    n_replicates_R_norm: 2000
    seed0: 21160820
    coordinate_labels:
