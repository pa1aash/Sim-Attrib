  why_the_offset_is_not_zero: m0 is the prior-predictive mean over R_norm replicates recorded in results/jacobian_rank.S_B.yaml,
    so it carries Monte Carlo error of order 1/sqrt(R_norm) per normalised summary coordinate. That error
    propagates through pinv(J) into eta_hat and is a FLOOR on what the selection rule can attribute. It
    is a property of the recorded normalisation, not of the simulator, and it is reported because a planted
    distortion smaller than this floor cannot be recovered by any amount of care elsewhere.
