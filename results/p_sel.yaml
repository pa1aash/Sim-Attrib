what_this_is: 'Session G6, Phase 1. Direct Monte Carlo measurement of p_sel, the probability that a draw
  from the simulator''s null lands in the observed selection cell, as defined in audit/MMC_COMPOSITION_SPEC.md
  section 4. It measures ONLY that. No part of the MMC composition is implemented, run, or priced by simulation
  here: the maximiser''s evaluation count M is taken from the specification''s own table and the cost
  is assembled in src/diagnostics/cost_gate.py.'
scope_assumption_D14: 'docs/DECISIONS.md D-14 (DECIDED, operator, 2026-08-20): every claim this project
  makes about component separability and attribution is scoped to a distortion model that assigns AT MOST
  ONE one-parameter distortion family to each component. Inside that scope S_B separates under all eight
  declarable family assignments; outside it, the six-column union is INSEPARABLE at kappa = 628.9 with
  a progression-observation confound. The selection rule measured here is a K = 3 object and is meaningful
  only under that restriction.'
selection_rule:
  source: src/attribution/selection.py
  why_it_had_to_be_written: audit/MMC_COMPOSITION_SPEC.md section 6 leaves T_k 'not specified' and 'deferred'.
    p_sel is a property of the cell T_k defines, so it cannot be measured until T_k is chosen. DEVIATIONS.md
    D-14.
  definition: 'z = (s(y) - m0)/sd; eta_hat = pinv(J) z; T_k = |eta_hat_k| / c_k; k_hat = argmax_k T_k.
    All of m0, sd, J and c are fixed constants of the base specification: nothing is estimated from the
    data the rule is applied to.'
  variants:
    studentised: c_k = ||pinv(J)[k,:]||, the null standard deviation of eta_hat_k when z has identity
      covariance. PRIMARY.
    plain: c_k = 1. Components compared on the common ETA_SCALE.
