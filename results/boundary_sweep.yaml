what_this_is: 'Session G7, Phase 1. OUTSTANDING.md O-30: the nuisance half-width at which the selection
  cells stop being reachable, between theta_0 and the +/-5% boundary session G6 measured. It reports p_min(w)
  = min over the 42-point design, min over the K cells, of p_sel -- the quantity audit/MMC_COMPOSITION_SPEC.md
  section 4 point 1 and src/diagnostics/cost_gate.py both consume.'
this_is_characterisation_not_verdict_seeking: 'docs/DECISIONS.md D-16 -- the MMC composition is dropped
  as an experimental vehicle and kept as a stated negative result -- was DECIDED by the operator at the
  start of session G7, BEFORE this script was written and before any number in this file existed. Nothing
  here can soften or reopen it. What it buys is a negative result with a shape rather than a bare threshold
  statement. Had this sweep found the cells reachable out to 0.04, the composition would still be dropped:
  D-16''s reason is that section 3.4''s lemma forces a theta-free rule and this simulator''s nuisance-to-noise
  ratio then makes the observed cell unreachable somewhere inside any box a domain reader would call plausible.'
scope_assumption_D14: 'docs/DECISIONS.md D-14 (DECIDED, operator, 2026-08-20): every claim this project
  makes about component separability and attribution is scoped to a distortion model that assigns AT MOST
  ONE one-parameter distortion family to each component. The selection rule measured here is a K = 3 object
  and is meaningful only under that restriction.'
