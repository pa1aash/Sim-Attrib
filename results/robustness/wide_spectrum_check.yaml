what_this_is: Session G4 adversarial pass, finding 1, second half. Places the base and adversarial distortion
  columns side by side to see what the spectrum does when the component list is longer than three. Does
  not modify anything in results/. See audit/G3_ADVERSARIAL_REVIEW.md.
why_the_columns_are_comparable: Both family sets are exactly the identity at eta = 0, so both Jacobians
  are linearisations about the SAME point; both are divided by the SAME prior-predictive standard deviations;
  and both use the same common eta_scale, so one normalised unit means the same fractional deformation
  in every column.
what_this_cannot_show: Six columns is not the dozens of parameters the sloppy-models literature studies,
  and this is one simulator. A still-narrow six-column spectrum is weak evidence. A wide, smoothly decaying
  one is strong evidence that the three-column narrowness was a property of K = 3 rather than of the simulator.
