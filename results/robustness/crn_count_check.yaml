what_this_is: "Session G4 adversarial pass, finding 3. Tests whether the count-observation CRN failure\
  \ reported in audit/S3_REPORT.md \xA74.1 is a genuine degeneracy of common random numbers with a discrete\
  \ output, or an artefact of NumPy's Poisson sampler. Does not modify anything in results/. See audit/G3_ADVERSARIAL_REVIEW.md."
test_statistic: final_size = sum_t y_t. Chosen because it is LINEAR, so E[s(y)] = s(mu) exactly and the
  target derivative is available in closed form from the deterministic mean with no Monte Carlo error.
the_discriminator: poisson_inversion is the count layer under the MONOTONE coupling y = F^{-1}_lambda(u)
  with u frozen by the seed. If the failure were an artefact of NumPy's sampler -- which uses transformed
  rejection for lambda >= 10, so the number of uniforms it consumes depends on lambda -- the inversion
  coupling would repair it. If the failure is the discreteness of the output, inversion fails too.
