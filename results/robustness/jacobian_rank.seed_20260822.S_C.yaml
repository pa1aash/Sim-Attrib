  - 182.66600894083803
  prior_predictive_mean:
  - 35709.70358309681
  - 1909.6526923818221
  note: The prior-predictive normalisation is estimated at eta = 0, where every distortion family is the
    identity, so it does NOT depend on which family set is selected. It is re-estimated here anyway rather
    than reused, so this file stands on its own run.
