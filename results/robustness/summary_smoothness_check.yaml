what_this_is: Session G4 adversarial pass, finding 4. Tests whether the argmax inside S_A's peak statistics
  contaminates the Jacobian that results/jacobian_rank.S_A.yaml reports. Does not modify anything in results/.
  See audit/G3_ADVERSARIAL_REVIEW.md.
the_claim_under_test: 'src/simulators/summaries.py asserts that the parabolic interpolation leaves both
  peak statistics continuous across a change of the discrete argmax. Algebraically the LOCATION is continuous
  (both parabolas put the vertex midway between the tied bins) and the HEIGHT is not: from the left it
  is m + (m-a)/8 and from the right m + (m-c)/8, equal only if the outer neighbours a and c are equal.'
