what_this_is: ROBUSTNESS RE-RUN, session G4. NOT a replacement for results/jacobian_rank.S_A.yaml, which
  records what session G3 ran and is untouched. Same diagnostic code, same pre-registered thresholds,
  same h sweep, same normalisation rule, same replicate count; only the distortion family set and/or the
  seed differ. See audit/G3_ADVERSARIAL_REVIEW.md.
run_label: adversarial
family_set: adversarial
summary_set: S_A
summary_coordinate_labels:
- peak_height
- peak_time
- final_size
- growth_rate
component_labels:
- transmission
- progression
- observation
distortion_families:
  transmission: beta -> beta*exp(eta_1)   [constant rate multiplier; TARGETS progression via the beta/gamma
    aliasing]
  progression: gamma -> gamma*exp(-eta_2)   [constant rate multiplier, sign-aligned so eta_1 and eta_2
    move R0 the same way; TARGETS transmission]
  observation: rho -> rho*exp(eta_3*(t/T - 0.5))   [mean-centred log-linear reporting trend; TARGETS both,
    via the observed growth rate]
distortion_identity_at_zero: delta_k(.;0) == base simulator exactly for BOTH family sets, tested in tests/test_sir3.py
p_ref_peak_prevalence_fraction: 0.2335235106521953
