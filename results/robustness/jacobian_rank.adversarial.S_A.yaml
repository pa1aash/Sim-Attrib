leakage_check:
  what_is_checked: 'component-label equivariance: permuting the K columns must leave the singular values,
    the numerical rank and the condition number unchanged, and must permute the column norms, the coherence
    matrix and the near-null right singular vectors (up to sign) correspondingly'
  why_this_is_the_testable_content_of_the_leakage_claim: 'the diagnostic is given no component index and
    no ground-truth label, so it must treat the K columns symmetrically. Any component-indexed special
    case breaks equivariance and is caught here. Necessary, not sufficient: a leak that treated all components
    symmetrically would survive this.'
  n_permutations_tested: 5
  tolerance: 1.0e-10
  worst_discrepancy:
    singular_values: 2.6645352591003757e-15
    condition_number: 1.1084466677857563e-12
    column_norms: 0.0
    coherence: 0.0
    near_null_vectors: 1.3322676295501878e-15
  failures: []
  passes: true
adversarial_intent: 'This family set was designed to FAIL. Each family was chosen against a named target
  component before the run, on the reasoning recorded in the sir3.py module docstring: all three columns
  perturb the same dominant feature of an epidemic curve (its observed exponential growth rate), where
  the base set perturbs three qualitatively different features. If the pass verdict survives this, that
  is evidence the base verdict was not an artefact of a favourable family choice. If it does not survive,
  the base verdict is a statement about three chosen families and must be written as one.'
