framing: 'This diagnostic is INFRASTRUCTURE for a composition paper (maximized Monte Carlo, Dufour 2006,
  composed with a selection event for component-level misspecification attribution). It is NOT a claimed
  method contribution: the rank-and-condition-number screen on a sensitivity matrix is Cintron-Arias,
  Banks, Capaldi & Lloyd (2009) and finite differencing under simulation noise is More & Wild (2012).
  See docs/DECISIONS.md D-6 and audit/R2_THREAT_CHECK.md. Its purpose here is to decide whether component
  attribution is well posed for THIS simulator under THIS closed list of summary sets -- the precondition,
  per Kahl et al. (2019), for the composition being worth building at all.'
what_this_is: 'NEGATIVE CONTROL, not a result about the simulator. The identical sweep run with INDEPENDENT
  noise realisations across the +h and -h evaluations, i.e. without common random numbers. It exists to
  demonstrate the failure mode rather than to assert it: compare the singular values here against jacobian_rank.S_A.yaml.'
expected_behaviour: Without common random numbers the difference quotient carries noise of order obs_sigma/h,
  so the leading singular value should grow as 1/h and no plateau should be identifiable.
summary_set: S_A
