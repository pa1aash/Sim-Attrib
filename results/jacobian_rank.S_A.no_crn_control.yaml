leakage_how: The diagnostic never receives a component index, a ground-truth label, or any indication
  of which component is responsible for anything. Its whole input is the simulator as a callable, the
  distortion basis (that there are K one-parameter families and that perturbing family k means setting
  eta_k), and the resulting summary vectors. It computes a property of the map s(eta), not a guess about
  a hidden truth, so there is no hidden truth available to leak.
